<body><div id="stage"><canvas id="grain" width="1080" height="1920"></canvas></div>
<script type="module">
import { boot, grain } from '/_system/motion/kit.js';
import { createWorld } from './scene.js';
import { createOverlay, createPoster } from './overlay.js';
const C = await (await fetch(new URL('./cues.json', import.meta.url))).json();
const q = new URLSearchParams(location.search);
const clean = q.get('clean') === '1', poster = q.has('poster'), aa = parseInt(q.get('aa') || '0', 10);
const W = 1080, H = 1920, stage = document.getElementById('stage'), gc = document.getElementById('grain');
let world = null, overlay = null;
async function init() {
  await Promise.all([
    document.fonts.load('900 160px Alexandria', 'ستاك'), document.fonts.load('700 50px Alexandria', 'ستاك'),
    document.fonts.load('500 32px "IBM Plex Sans Arabic"', 'إعلان'), document.fonts.load('600 22px "JetBrains Mono"', 'A'),
    document.fonts.load('900 66px Archivo', 'S'),
  ]);
  world = await createWorld(W, H, C);
  stage.insertBefore(world.canvas, gc);
  overlay = poster ? null : createOverlay(stage, C, { W, H, project: world.project });
  if (poster) createPoster(stage, { W, H });
  stage.appendChild(gc);
}
const afterLoad = new Promise(res => (document.readyState === 'complete' ? res() : addEventListener('load', res, { once: true })));
const ready = afterLoad.then(() => new Promise((res, rej) => setTimeout(() => init().then(res, e => { console.error('init failed', e && e.stack); rej(e); }), 0)));
boot({ width: W, height: H, fps: C.fps, duration: C.duration, ready, seek: t => {
  if (!world) return;
  if (poster) { world.render(parseFloat(q.get('poster')) || 9.9, { aa: aa || 8, posterCam: true }); grain(gc, 7, { amount: 26, scale: 2 }); return; }
  // end card + signature are opaque: skip the (hidden) 3D frame there unless rendering the clean plate
  const st = (!clean && t >= C.endcard) ? { id: 'END' } : world.render(t, { clean, aa });
  overlay.render(t, { clean, sid: st.id });
  grain(gc, Math.round(t * C.fps), { amount: 26, scale: 2 });
} });
</script></body></html>
