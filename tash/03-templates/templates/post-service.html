<!doctype html>
<!-- FEED POST 4:5 · SERVICE CARD — picture first (real work in the band), then the service in one big line,
     one plain sentence, and what you get, separated by single lime dots.
     data: theme · image {src,fx,fy,zoom,fit,bg}  — or images [src, src] to hang several pieces side by side
           · concept {slate, ar} (required when the picture is concept work) · service · line · includes [..] -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="/_system/tokens.css"><link rel="stylesheet" href="/03-templates/src/base.css">
<style>
  .band { left: 0; top: 0; width: 1080px; height: 724px; z-index: 5; }
  .wall { position: absolute; left: 0; top: 0; width: 1080px; height: 724px; z-index: 5; background: var(--surface);
          display: flex; justify-content: center; align-items: center; gap: 48px; }
  .wall img { height: 604px; width: auto; display: block; }
  .concept { position: absolute; left: 96px; top: 756px; z-index: 12; display: flex; gap: 22px; align-items: baseline; direction: ltr; }
  .concept .slate { font-size: 20px; }
  .concept .concept-ar { font-size: 24px; }
  .service { position: absolute; right: 96px; left: 96px; top: 812px; z-index: 10; color: var(--fg); line-height: 1.3; }
  .line { position: absolute; right: 96px; left: 200px; z-index: 10; color: var(--sub); font-size: 38px; line-height: 1.5; text-wrap: balance; }
  .wmk { position: absolute; left: 96px; bottom: 100px; z-index: 12; }
  .includes { position: absolute; right: 96px; left: 300px; bottom: 96px; z-index: 10; display: flex; flex-wrap: wrap; align-items: center;
              column-gap: 28px; row-gap: 10px; font-size: 34px; line-height: 1.3; color: var(--fg); }
  .includes .sep { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); flex: none; }
</style></head><body><div id="stage"></div>
<script type="module">
import { run } from '/03-templates/src/tpl.js';
run(async (d, { stage, T, rich, h, put, photo, concept, wordmark }) => {
  const service = h('div', { class: 'disp service key', 'data-fit': '84,128', 'data-lines': '1', 'data-name': 'service', html: rich(d.service) });
  const line = d.line ? h('div', { class: 'txt line key', 'data-fit': '32,38', 'data-lines': '2', 'data-name': 'line', html: rich(d.line) }) : null;
  const inc = h('div', { class: 'txt includes key', 'data-name': 'includes' });
  (d.includes || []).forEach((t, i) => { if (i) inc.append(h('span', { class: 'sep' })); inc.append(h('span', { html: rich(t) })); });
  const pic = Array.isArray(d.images)
    ? h('div', { class: 'wall' }, d.images.map(src => h('img', { src, alt: '' })))
    : photo(d.image, 'layer band');
  put(stage,
    pic,
    h('div', { class: 'wmk' }, wordmark(T, 112)),
    concept(d.concept),
    service, line, inc,
  );
  return { format: 'post', light: false,
    after: () => { if (line) line.style.top = (service.offsetTop + service.offsetHeight + 10) + 'px'; } };
});
</script></body></html>
