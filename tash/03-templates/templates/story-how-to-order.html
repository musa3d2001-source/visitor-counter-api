<!doctype html>
<!-- STORY 1080×1920 · «شلون تطلب؟» — the four steps as the chat they describe: our four messages on the right,
     and at the end, on the left, your lime bubble already typing (your turn). Top 250 / bottom 300 kept free.
     data: theme · headline · steps [ "…", "…", "…", "…" ] (2 short lines each) · you (optional words next to your bubble) -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="/_system/tokens.css"><link rel="stylesheet" href="/03-templates/src/base.css">
<style>
  .headline { position: absolute; right: 96px; left: 96px; top: 262px; z-index: 10; color: var(--fg); }
  .thread { position: absolute; right: 96px; left: 96px; z-index: 10; display: flex; flex-direction: column; align-items: flex-start; gap: 22px; }
  .step { max-width: 780px; padding: 28px 44px 32px; font-size: 44px; line-height: 1.45; text-wrap: balance; }
  .step .n { display: block; font-size: 20px; color: var(--smoke); margin-bottom: 8px; direction: ltr; text-align: right; }
  .you { position: absolute; left: 96px; z-index: 10; display: flex; align-items: center; gap: 26px; direction: ltr; }
  .you .w { font-size: 40px; color: var(--sub); direction: rtl; }
</style></head><body><div id="stage"></div>
<script type="module">
import { run, COL } from '/03-templates/src/tpl.js';
run(async (d, { stage, T, rich, h, put, linesOf, bubble, typingBubble }) => {
  const head = h('div', { class: 'disp headline key', 'data-fit': '104,150', 'data-lines': linesOf(d.headline, 1), 'data-name': 'headline', html: rich(d.headline) });
  const thread = h('div', { class: 'thread' });
  (d.steps || []).forEach((s, i) => thread.append(
    bubble([h('span', { class: 'slate n', text: String(i + 1).padStart(2, '0') }), h('span', { html: rich(s) })],
      { fill: T.surface, color: T.fg, side: 'right', cls: 'txt step key', r: 44 })));
  thread.lastChild && (thread.lastChild.dataset.name = 'last step');
  const you = h('div', { class: 'you key', 'data-name': 'your turn' },
    h('div', { html: typingBubble({ scale: 0.62, fill: COL.lime, dot: COL.ink, side: 'left', pose: [0, -10, -4] }) }),
    d.you ? h('div', { class: 'txt w', html: rich(d.you) }) : null);
  put(stage, head, thread, you);
  return { format: 'story', lightAt: '80% 8%', after: () => {
    thread.style.top = (head.offsetTop + head.offsetHeight + 40) + 'px';
    you.style.top = (thread.offsetTop + thread.offsetHeight + 34) + 'px';
  } };
});
</script></body></html>
