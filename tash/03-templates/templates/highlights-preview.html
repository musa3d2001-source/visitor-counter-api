<!doctype html>
<!-- QA SHEET · how the five highlight covers read on the profile (circle crop, real size on a 1080-wide screen ≈ Ø176,
     and the phone's smallest ≈ Ø64). Draws the same icons as highlight.html from the same data file.
     data: source (path to the highlights deck JSON) · theme -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="/_system/tokens.css"><link rel="stylesheet" href="/03-templates/src/base.css">
<style>
  .title { position: absolute; left: 72px; top: 64px; z-index: 10; }
  .row { position: absolute; right: 72px; left: 72px; z-index: 10; display: flex; justify-content: space-between; direction: rtl; }
  .item { display: grid; justify-items: center; gap: 18px; width: 176px; }
  .circle { width: 176px; height: 176px; border-radius: 50%; overflow: hidden; background: var(--ink); box-shadow: 0 0 0 5px #0B0B0B, 0 0 0 7px #3A3B36; display: grid; place-items: center; }
  .name { font-family: var(--f-text-ar); font-weight: 500; font-size: 28px; color: var(--fg); white-space: nowrap; }
  .small .item { width: 64px; gap: 10px; }
  .small .circle { width: 64px; height: 64px; box-shadow: 0 0 0 1px #2C2C29, 0 0 0 3px #0B0B0B, 0 0 0 4px #3A3B36; }
  .small .name { font-size: 15px; }
  .note { position: absolute; left: 72px; bottom: 52px; z-index: 10; font-size: 18px; }
</style></head><body><div id="stage"></div>
<script type="module">
import { run } from '/03-templates/src/tpl.js';
import { icon } from '/03-templates/src/icons.js';
run(async (d, { stage, T, h, put, rich }) => {
  const deck = await (await fetch(d.source || '/03-templates/data/highlights.json')).json();
  // the cover is 1080×1920 with the icon centred; the profile shows a circle of the centre (Ø1080 → Ø176)
  const circle = (it, px) => h('div', { class: 'circle', html: icon(it.icon, { fg: T.fg, bg: T.bg, accent: T.accent, size: px * 640 / 1080 }) });
  const row = (px, cls, y) => put(h('div', { class: 'row ' + cls, style: `top:${y}px` }),
    deck.slides.map(it => h('div', { class: 'item' }, circle(it, px), h('div', { class: 'name', html: rich(it.name) }))));
  put(stage,
    h('div', { class: 'slate title', text: 'HIGHLIGHTS — PROFILE PREVIEW' }),
    row(176, '', 150),
    row(64, 'small', 452),
    h('div', { class: 'slate note', text: 'Ø176 ≈ 1080-WIDE SCREENSHOT · Ø64 ≈ SMALLEST ON PHONE' }));
  return { width: 1080, height: 700, safe: null, zones: [], light: false };
});
</script></body></html>
