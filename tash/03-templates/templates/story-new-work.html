<!doctype html>
<!-- STORY 1080×1920 · «شغل جديد» — announce a new piece: the headline with the brand ellipsis, the work hung as a plate,
     and a gallery label under it. Top 250 and bottom 300 stay free (story UI, reply bar / link sticker).
     data: theme · headline · line · image {src, fx, fy, zoom, bg} · title · kind · concept {slate, ar} -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="/_system/tokens.css"><link rel="stylesheet" href="/03-templates/src/base.css">
<style>
  .headline { position: absolute; right: 96px; left: 96px; top: 262px; z-index: 10; color: var(--fg); }
  .line { position: absolute; right: 96px; left: 96px; z-index: 10; color: var(--sub); font-size: 44px; line-height: 1.45; }
  .plate { left: 96px; width: 888px; z-index: 5; }
  .label { position: absolute; right: 96px; left: 96px; z-index: 10; display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; }
  .label .t { display: grid; gap: 2px; }
  .label .name { font-family: var(--f-display-ar); font-weight: 800; font-size: 60px; line-height: 1.3; color: var(--fg); }
  .label .kind { font-size: 30px; line-height: 1.3; color: var(--sub); }
  .label .concept { display: grid; gap: 10px; justify-items: end; padding-bottom: 6px; }
  .label .concept .slate { font-size: 20px; }
  .label .concept .concept-ar { font-size: 24px; }
</style></head><body><div id="stage"></div>
<script type="module">
import { run } from '/03-templates/src/tpl.js';
run(async (d, { stage, T, rich, h, put, linesOf, photo, concept }) => {
  const head = h('div', { class: 'disp headline key', 'data-fit': '104,150', 'data-lines': linesOf(d.headline, 1), 'data-name': 'headline', html: rich(d.headline) });
  const line = d.line ? h('div', { class: 'txt line key', 'data-fit': '36,44', 'data-lines': '2', 'data-name': 'line', html: rich(d.line) }) : null;
  const plate = photo({ bg: '#0D0C0A', ...d.image }, 'layer plate key');
  plate.dataset.name = 'plate';
  const label = h('div', { class: 'label key', 'data-name': 'label' },
    h('div', { class: 't' }, h('div', { class: 'name', html: rich(d.title) }), d.kind ? h('div', { class: 'txt kind', html: rich(d.kind) }) : null),
    concept(d.concept));
  put(stage, head, line, plate, label);
  return { format: 'story', lightAt: '80% 10%', after: () => {
    if (line) line.style.top = (head.offsetTop + head.offsetHeight + 2) + 'px';
    const top = (line ? line.offsetTop + line.offsetHeight : head.offsetTop + head.offsetHeight) + 48;
    const bottom = 1620 - label.offsetHeight - 36;
    plate.style.top = top + 'px'; plate.style.height = (bottom - top) + 'px';
    label.style.top = (bottom + 30) + 'px';
  } };
});
</script></body></html>
