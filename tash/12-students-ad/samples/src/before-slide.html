<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قبل — شريحة افتراضية</title>
<style>
/* the "before": an untouched default title slide (same content as deck-uni-01-title) */
@font-face{font-family:"Plex Arabic";src:url("../../../_system/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype");font-weight:400;font-display:block}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#FFFFFF}
body{font-family:"Plex Arabic",sans-serif;color:#000;-webkit-font-smoothing:antialiased}
.slide{position:relative;width:1920px;height:1080px;background:#FFFFFF}

.title{position:absolute;left:240px;right:240px;top:300px;text-align:center;font-weight:400;font-size:84px;line-height:1.2;color:#000}
.subtitle{position:absolute;left:240px;right:240px;top:428px;text-align:center;font-weight:400;font-size:40px;line-height:1.3;color:#595959}

/* the bullet box was nudged by hand: off-centre, uneven indents, one line centred by mistake */
.list{position:absolute;left:640px;width:700px;top:560px;font-weight:400;font-size:31px;line-height:1.55;color:#000}
.list p{position:relative;padding-right:34px}
.list p::before{content:"•";position:absolute;right:0;top:0}
.list .in2{padding-right:78px}
.list .in2::before{right:44px}
.list .tight{padding-right:16px}
.list .mid{text-align:center;padding-right:0}
.list .mid::before{position:static;margin-left:10px}
</style>
</head>
<body>
<div class="slide">
  <div class="title">مسار</div>
  <div class="subtitle">تطبيق يدلّك على موقف فاضي بالحرم الجامعي</div>
  <div class="list">
    <p>إعداد: نورة، فهد، دانة، يوسف</p>
    <p class="in2">إشراف: د. مريم</p>
    <p class="tight">قسم علوم الحاسوب</p>
    <p class="mid">العام الجامعي ٢٠٢٦–٢٠٢٧</p>
  </div>
</div>
</body>
</html>
