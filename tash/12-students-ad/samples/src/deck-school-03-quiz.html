<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>دورة الماء في الطبيعة — ٣ اختبر نفسك</title>
<style>
@font-face{font-family:"Alexandria";src:url("../../../_system/fonts/Alexandria-VF.ttf") format("truetype");font-weight:100 900;font-display:block}
@font-face{font-family:"Plex Arabic";src:url("../../../_system/fonts/IBMPlexSansArabic-Medium.ttf") format("truetype");font-weight:500;font-display:block}
@font-face{font-family:"Plex Arabic";src:url("../../../_system/fonts/IBMPlexSansArabic-SemiBold.ttf") format("truetype");font-weight:600;font-display:block}

:root{
  --sun:#FFC933; --sun-ray:#FFD452;
  --navy:#0E2A66; --blue:#1B5CE0;
  --ok:#1FB386; --coral:#FF6B4A;
  --cream:#FFFDF6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--sun)}
body{font-family:"Plex Arabic",sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.slide{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--sun)}
.scene{position:absolute;inset:0;width:1920px;height:1080px;display:block}

.col{position:absolute;top:84px;right:120px;width:1000px;text-align:right}
.chip{display:inline-flex;align-items:center;gap:12px;font-family:"Alexandria";font-weight:600;font-size:27px;line-height:1;
  padding:15px 28px 17px 24px;border-radius:999px;background:var(--navy);color:#fff;white-space:nowrap}
.chip svg{width:26px;height:26px;display:block}
h2{font-family:"Alexandria";font-weight:700;font-size:128px;line-height:1.12;margin-top:22px;white-space:nowrap;letter-spacing:0}

.q{position:relative;margin-top:30px;background:#fff;border-radius:40px;padding:32px 44px 38px;box-shadow:0 12px 0 rgba(14,42,102,.9)}
.q .meta{display:flex;align-items:center;justify-content:space-between}
.q .meta b{font-family:"Alexandria";font-weight:700;font-size:26px;color:var(--blue);white-space:nowrap}
.q .dots{display:flex;gap:10px;direction:rtl}
.q .dots i{width:44px;height:12px;border-radius:6px;background:#E3E8F2}
.q .dots i.on{background:var(--blue)}
.q p{font-family:"Alexandria";font-weight:700;font-size:48px;line-height:1.45;margin-top:14px}

.ans{margin-top:34px;display:grid;grid-template-columns:1fr 1fr;gap:24px 26px}
.a{position:relative;display:flex;align-items:center;gap:22px;height:118px;padding:0 22px 0 28px;background:#fff;border-radius:30px;
  box-shadow:0 9px 0 rgba(14,42,102,.9)}
.a .l{flex:none;width:72px;height:72px;border-radius:50%;background:#EAF0FB;display:grid;place-items:center;
  font-family:"Alexandria";font-weight:700;font-size:34px;color:var(--navy);padding-bottom:4px}
.a span{font-family:"Alexandria";font-weight:700;font-size:46px;line-height:1.2;white-space:nowrap}
.a.ok{background:var(--ok);color:#fff}
.a.ok .l{background:#fff;padding:0}
.a.ok .l svg{width:40px;height:40px;display:block}
.sticker{position:absolute;left:-26px;top:-78px;transform:rotate(-8deg);background:var(--coral);color:#fff;border-radius:18px;
  font-family:"Alexandria";font-weight:700;font-size:32px;line-height:1;padding:14px 22px 17px;white-space:nowrap;
  box-shadow:0 6px 0 rgba(14,42,102,.9)}

.bubble{position:absolute;left:470px;top:196px;background:#fff;border-radius:34px;padding:20px 34px 26px;
  font-family:"Alexandria";font-weight:700;font-size:50px;line-height:1.1;white-space:nowrap;box-shadow:0 9px 0 rgba(14,42,102,.9)}
.bubble::after{content:"";position:absolute;left:64px;bottom:-30px;width:44px;height:44px;background:#fff;
  clip-path:polygon(0 0,100% 0,10% 100%)}
.timer{position:absolute;left:400px;top:904px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;
  border-radius:999px;padding:12px 30px 14px 14px;white-space:nowrap}
.timer svg{width:50px;height:50px;display:block}
.timer b{font-family:"Alexandria";font-weight:700;font-size:32px;line-height:1}

.pg{position:absolute;left:96px;bottom:34px;width:64px;height:64px;border-radius:50%;background:var(--cream);
  display:grid;place-items:center;font-family:"Alexandria";font-weight:700;font-size:30px;color:var(--navy);padding-bottom:3px;
  box-shadow:0 6px 0 rgba(8,34,110,.28)}
</style>
</head>
<body>
<div class="slide">

<svg class="scene" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <path id="ray" d="M0 0L-190 -2300L190 -2300Z"/>
    <path id="drop" d="M0-22C9-9 15 0 15 9A15 15 0 1 1-15 9C-15 0-9-9 0-22Z"/>
  </defs>

  <!-- sunburst behind the mascot -->
  <g transform="translate(400 600)" fill="#FFD452">
    <use href="#ray"/><use href="#ray" transform="rotate(20)"/><use href="#ray" transform="rotate(40)"/><use href="#ray" transform="rotate(60)"/>
    <use href="#ray" transform="rotate(80)"/><use href="#ray" transform="rotate(100)"/><use href="#ray" transform="rotate(120)"/><use href="#ray" transform="rotate(140)"/>
    <use href="#ray" transform="rotate(160)"/><use href="#ray" transform="rotate(180)"/><use href="#ray" transform="rotate(200)"/><use href="#ray" transform="rotate(220)"/>
    <use href="#ray" transform="rotate(240)"/><use href="#ray" transform="rotate(260)"/><use href="#ray" transform="rotate(280)"/><use href="#ray" transform="rotate(300)"/>
    <use href="#ray" transform="rotate(320)"/><use href="#ray" transform="rotate(340)"/>
  </g>
  <circle cx="400" cy="600" r="300" fill="#FFDD73"/>
  <circle cx="400" cy="600" r="220" fill="#FFE596"/>

  <!-- floating drops + sparkles -->
  <g fill="#fff" opacity=".95">
    <use href="#drop" transform="translate(120 250) scale(1.3)"/>
    <use href="#drop" transform="translate(700 830) scale(1.0)"/>
    <use href="#drop" transform="translate(110 760) scale(.9)"/>
  </g>
  <g fill="#0E2A66">
    <path d="M760 150l9 25 25 9-25 9-9 25-9-25-25-9 25-9Z"/>
    <path d="M86 470l6 16 16 6-16 6-6 16-6-16-16-6 16-6Z"/>
  </g>
  <g fill="none" stroke="#0E2A66" stroke-width="7" stroke-linecap="round">
    <circle cx="250" cy="170" r="14"/>
  </g>

  <!-- mascot, excited -->
  <g transform="translate(400 590) scale(2.05)">
    <ellipse cx="0" cy="134" rx="66" ry="10" fill="rgba(214,140,0,.28)"/>
    <path d="M-74 30Q-112 10-114-30" fill="none" stroke="#6FC3FF" stroke-width="14" stroke-linecap="round"/><circle cx="-114" cy="-34" r="12" fill="#6FC3FF"/>
    <path d="M74 30Q112 10 114-30" fill="none" stroke="#6FC3FF" stroke-width="14" stroke-linecap="round"/><circle cx="114" cy="-34" r="12" fill="#6FC3FF"/>
    <path d="M0-104C40-48 78-4 78 44A78 78 0 1 1-78 44C-78-4-40-48 0-104Z" fill="#6FC3FF"/>
    <path d="M-44 6C-52 24-54 40-52 54" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" opacity=".85"/>
    <circle cx="-24" cy="38" r="11" fill="#0E2A66"/><circle cx="24" cy="38" r="11" fill="#0E2A66"/>
    <circle cx="-20" cy="34" r="4" fill="#fff"/><circle cx="28" cy="34" r="4" fill="#fff"/>
    <path d="M-20 60Q0 88 20 60Z" fill="#0E2A66" stroke="#0E2A66" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-10 72Q0 80 10 72" fill="none" stroke="#FF8A7A" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-48" cy="60" r="10" fill="#FF9A86"/><circle cx="48" cy="60" r="10" fill="#FF9A86"/>
  </g>

  <!-- footer sea -->
  <path d="M-60 1008q60-24 120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0L1980 1080L-60 1080Z" fill="#5AA6FF"/>
  <path d="M-120 1040q60-22 120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0L2040 1080L-120 1080Z" fill="#2F7BFF"/>
</svg>

<div class="bubble">جاهزين؟</div>
<div class="timer">
  <svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="25" fill="#fff"/><circle cx="25" cy="27" r="15" fill="none" stroke="#0E2A66" stroke-width="4"/>
    <path d="M25 27V18" stroke="#FF6B4A" stroke-width="4" stroke-linecap="round"/><path d="M21 8h8" stroke="#0E2A66" stroke-width="4" stroke-linecap="round"/></svg>
  <b>١٥ ثانية</b>
</div>

<div class="col">
  <span class="chip"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="#FFC933"/><g transform="translate(26 0) scale(-1 1)"><path d="M9.6 10.2a3.6 3.6 0 1 1 5.2 3.2c-1.2.6-1.8 1.3-1.8 2.6" fill="none" stroke="#0E2A66" stroke-width="2.6" stroke-linecap="round"/><circle cx="13" cy="19.6" r="1.6" fill="#0E2A66"/></g></svg>مراجعة سريعة</span>
  <h2>اختبر نفسك!</h2>

  <div class="q">
    <div class="meta"><b>سؤال ١ من ٣</b><span class="dots"><i class="on"></i><i></i><i></i></span></div>
    <p>ماذا نسمّي تحوّل بخار الماء<br>إلى قطرات صغيرة تكوّن الغيوم؟</p>
  </div>

  <div class="ans">
    <div class="a"><span class="l">أ</span><span>التبخر</span></div>
    <div class="a ok"><span class="l"><svg viewBox="0 0 40 40"><path d="M10 21l7 7 14-15" fill="none" stroke="#1FB386" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>التكاثف</span><em class="sticker">أحسنت!</em></div>
    <div class="a"><span class="l">ج</span><span>الهطول</span></div>
    <div class="a"><span class="l">د</span><span>الجريان</span></div>
  </div>
</div>

<div class="pg">٣</div>

</div>
</body>
</html>
