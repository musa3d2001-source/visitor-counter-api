<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>دورة الماء في الطبيعة — ١ العنوان</title>
<style>
@font-face{font-family:"Alexandria";src:url("../../../_system/fonts/Alexandria-VF.ttf") format("truetype");font-weight:100 900;font-display:block}
@font-face{font-family:"Plex Arabic";src:url("../../../_system/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype");font-weight:400;font-display:block}
@font-face{font-family:"Plex Arabic";src:url("../../../_system/fonts/IBMPlexSansArabic-Medium.ttf") format("truetype");font-weight:500;font-display:block}
@font-face{font-family:"Plex Arabic";src:url("../../../_system/fonts/IBMPlexSansArabic-SemiBold.ttf") format("truetype");font-weight:600;font-display:block}
@font-face{font-family:"Plex Arabic";src:url("../../../_system/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype");font-weight:700;font-display:block}

:root{
  --sky:#CFEFFF; --sky-soft:#E2F6FF;
  --sea-1:#5AA6FF; --sea-2:#2F7BFF; --sea-3:#1B5CE0; --sea-4:#1247B8;
  --navy:#0E2A66;
  --sun:#FFC933; --sun-deep:#FFB21A;
  --coral:#FF6B4A;
  --mint:#5CCBA8; --teal:#27B08A; --teal-deep:#1B9777;
  --grass:#8ADB6B; --grass-deep:#5FC25C;
  --cloud:#FFFFFF; --cream:#FFFDF6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--sky)}
body{font-family:"Plex Arabic",sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.slide{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--sky)}
.scene{position:absolute;inset:0;width:1920px;height:1080px;display:block}

.copy{position:absolute;top:96px;right:120px;width:900px;text-align:right}
.chips{display:flex;gap:14px;justify-content:flex-start;margin-bottom:22px}
.chip{font-family:"Alexandria";font-weight:600;font-size:28px;line-height:1;padding:17px 30px 19px;border-radius:999px;white-space:nowrap}
.chip.solid{background:var(--navy);color:#fff}
.chip.light{background:#fff;color:var(--navy)}
h1{font-family:"Alexandria";font-weight:700;color:var(--navy);line-height:1.14;letter-spacing:0}
h1 .l1{display:block;font-size:170px;white-space:nowrap}
h1 .l2{display:block;font-size:122px;color:var(--sea-3);margin-top:30px;white-space:nowrap}
.squiggle{display:block;width:360px;height:48px;margin:74px 0 18px auto}
.lede{font-weight:500;font-size:40px;line-height:1.55;color:var(--navy);white-space:nowrap}

.byline{display:flex;width:max-content;margin:34px 0 0 auto;align-items:center;gap:18px;
  background:var(--cream);border-radius:999px;padding:14px 34px 16px 22px;box-shadow:0 8px 0 rgba(8,34,110,.28)}
.byline .dot{width:44px;height:44px;border-radius:50%;background:var(--sun);display:grid;place-items:center}
.byline .dot svg{width:24px;height:24px;display:block}
.byline span{font-family:"Alexandria";font-weight:600;font-size:30px;line-height:1.3;white-space:nowrap}
.byline b{font-weight:700}
</style>
</head>
<body>
<div class="slide">

<svg class="scene" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <g id="cloud">
      <rect x="0" y="100" width="360" height="92" rx="46"/>
      <circle cx="108" cy="104" r="64"/>
      <circle cx="206" cy="82" r="82"/>
      <circle cx="288" cy="118" r="52"/>
    </g>
    <path id="drop" d="M0-22C9-9 15 0 15 9A15 15 0 1 1-15 9C-15 0-9-9 0-22Z"/>
  </defs>

  <!-- soft air shapes -->
  <circle cx="1500" cy="330" r="470" fill="#DDF4FF"/>
  <circle cx="250" cy="230" r="330" fill="#E0F5FF"/>

  <!-- sun -->
  <g transform="translate(250 230)">
    <circle r="246" fill="#FFF3C2"/>
    <g stroke="#FFC933" stroke-width="24" stroke-linecap="round">
      <line x1="0" y1="-168" x2="0" y2="-206"/>
      <line x1="0" y1="-168" x2="0" y2="-206" transform="rotate(30)"/>
      <line x1="0" y1="-168" x2="0" y2="-206" transform="rotate(60)"/>
      <line x1="0" y1="-168" x2="0" y2="-206" transform="rotate(90)"/>
      <line x1="0" y1="-168" x2="0" y2="-206" transform="rotate(120)"/>
      <line x1="0" y1="-168" x2="0" y2="-206" transform="rotate(150)"/>
      <line x1="0" y1="-168" x2="0" y2="-206" transform="rotate(180)"/>
      <line x1="0" y1="-168" x2="0" y2="-206" transform="rotate(210)"/>
      <line x1="0" y1="-168" x2="0" y2="-206" transform="rotate(240)"/>
      <line x1="0" y1="-168" x2="0" y2="-206" transform="rotate(270)"/>
      <line x1="0" y1="-168" x2="0" y2="-206" transform="rotate(300)"/>
      <line x1="0" y1="-168" x2="0" y2="-206" transform="rotate(330)"/>
    </g>
    <circle r="128" fill="#FFC933"/>
    <path d="M-92-52A106 106 0 0 1 20-104" fill="none" stroke="#FFE08A" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- far cloud -->
  <use href="#cloud" transform="translate(770 96) scale(.62)" fill="#fff"/>

  <!-- mountains -->
  <!-- back mountain: apex (300,470), half-base 430, base y 930 -->
  <path d="M-130 930L248.4 525.2Q300 470 351.6 525.2L730 930Z" fill="#5CCBA8"/>
  <path d="M170.9 608.1L248.4 525.2Q300 470 351.6 525.2L429.1 608.1q-21.5 30-43 0q-21.5 30-43 0q-21.5 30-43 0q-21.5 30-43 0q-21.5 30-43 0q-21.6 30-43.2 0Z" fill="#fff"/>
  <!-- front mountain: apex (640,560), half-base 400, base y 930 -->
  <path d="M240 930L592 604.4Q640 560 688 604.4L1040 930Z" fill="#27B08A"/>
  <clipPath id="mtnF"><path d="M240 930L592 604.4Q640 560 688 604.4L1040 930Z"/></clipPath>
  <path clip-path="url(#mtnF)" d="M640 540L1100 980L700 980Z" fill="#1B9777" opacity=".55"/>
  <path d="M520 671L592 604.4Q640 560 688 604.4L760 671q-20 28-40 0q-20 28-40 0q-20 28-40 0q-20 28-40 0q-20 28-40 0q-20 28-40 0Z" fill="#fff"/>


  <!-- rain cloud + rain -->
  <g fill="#3F8CFF">
    <use href="#drop" transform="translate(400 470) scale(1.15)"/>
    <use href="#drop" transform="translate(470 520) scale(1.15)"/>
    <use href="#drop" transform="translate(545 462) scale(1.15)"/>
    <use href="#drop" transform="translate(610 530) scale(1.15)"/>
    <use href="#drop" transform="translate(690 474) scale(1.15)"/>
    <use href="#drop" transform="translate(545 592) scale(1.15)"/>
  </g>
  <use href="#cloud" transform="translate(300 216) scale(1.2)" fill="#fff"/>
  <path d="M348 420h330" stroke="#DCEBFA" stroke-width="18" stroke-linecap="round"/>

  <!-- ground -->
  <path d="M0 880C220 820 520 840 760 880C900 904 1010 930 1080 980L1080 1080L0 1080Z" fill="#8ADB6B"/>
  <path d="M0 950C200 900 420 920 640 960C760 982 860 1010 930 1080L0 1080Z" fill="#5FC25C" opacity=".6"/>
  <!-- river: mountain to sea -->
  <path d="M628 690C598 750 654 790 630 850C618 890 660 920 760 962L806 925C732 905 672 886 680 852C694 790 636 750 642 690Q635 680 628 690Z" fill="#7CC6FF"/>
  <!-- small trees -->
  <g>
    <rect x="131" y="866" width="10" height="34" rx="5" fill="#1B9777"/>
    <circle cx="136" cy="846" r="30" fill="#1FA06A"/>
    <rect x="203" y="880" width="10" height="30" rx="5" fill="#1B9777"/>
    <circle cx="208" cy="866" r="22" fill="#27B08A"/>
    <rect x="890" y="912" width="10" height="30" rx="5" fill="#1B9777"/>
    <circle cx="895" cy="896" r="24" fill="#1FA06A"/>
  </g>

  <!-- sea -->
  <path d="M630 1016C664 962 704 938 760 936q60-26 120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0L1960 1080L630 1080Z" fill="#5AA6FF"/>
  <path d="M-60 986q60-28 120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0L1980 1080L-60 1080Z" fill="#2F7BFF"/>
  <!-- droplet mascot riding the wave -->
  <g transform="translate(1318 924)">
    <path d="M0-104C40-48 78-4 78 44A78 78 0 1 1-78 44C-78-4-40-48 0-104Z" fill="#6FC3FF"/>
    <path d="M-44 6C-52 24-54 40-52 54" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".85"/>
    <circle cx="-24" cy="40" r="11" fill="#0E2A66"/><circle cx="24" cy="40" r="11" fill="#0E2A66"/>
    <circle cx="-20" cy="36" r="4" fill="#fff"/><circle cx="28" cy="36" r="4" fill="#fff"/>
    <path d="M-16 64Q0 82 16 64" fill="none" stroke="#0E2A66" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-46" cy="62" r="10" fill="#FF9A86"/><circle cx="46" cy="62" r="10" fill="#FF9A86"/>
    <!-- waving arm -->
    <path d="M72 34Q108 20 110-18" fill="none" stroke="#6FC3FF" stroke-width="15" stroke-linecap="round"/><circle cx="110" cy="-22" r="13" fill="#6FC3FF"/>
  </g>
  <path d="M-120 1034q60-26 120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0L2040 1080L-120 1080Z" fill="#1B5CE0"/>

  <!-- vapour rising from the sea -->
  <g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".95">
    <path d="M1110 934q-22-26 0-52t0-52t0-52"/>
    <path d="M1176 918q-22-26 0-52t0-52"/>
    <path d="M1044 918q-22-26 0-52t0-52"/>
  </g>

</svg>

<div class="copy">
  <div class="chips"><span class="chip solid">العلوم</span><span class="chip light">الصف السابع</span></div>
  <h1><span class="l1">دورة الماء</span><span class="l2">في الطبيعة</span></h1>
  <svg class="squiggle" viewBox="0 0 360 48" aria-hidden="true"><path d="M12 24q28-26 56 0t56 0t56 0t56 0t56 0t56 0" fill="none" stroke="#FFC933" stroke-width="14" stroke-linecap="round"/></svg>
  <p class="lede">رحلة قطرة من البحر إلى الغيم… ثم إلى البحر من جديد.</p>
  <div class="byline">
    <span class="dot"><svg viewBox="-20 -26 40 52"><path d="M0-22C9-9 15 0 15 9A15 15 0 1 1-15 9C-15 0-9-9 0-22Z" fill="#0E2A66"/></svg></span>
    <span>إعداد: <b>فريق القطرة</b></span>
  </div>
</div>

</div>
</body>
</html>
